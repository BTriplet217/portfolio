<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Nickname Generator — Topic-aware</title>
  <style>
    :root{
      --bg:#0b0f1a; --panel:#11182a; --ink:#eef2ff; --muted:#9fb0d7;
      --accent:#6dd6ff; --accent-2:#a78bfa; --border:#1c2440; --chip:#0e1530;
      --stage:#0a1022; --focus:#74f; --success:#2ecc71;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f6f7fb; --panel:#fff; --ink:#0f1320; --muted:#5b647d; --accent:#3d57ff;
        --accent-2:#7c3aed; --border:#e7e9f3; --chip:#eef1ff; --stage:#f3f6ff; --focus:#3758f9;
      }
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: radial-gradient(1200px 800px at 20% -10%, rgba(109,214,255,.14), transparent 60%),
                  radial-gradient(900px 600px at 120% 20%, rgba(167,139,250,.10), transparent 60%),
                  var(--bg);
      color:var(--ink); line-height:1.45; -webkit-font-smoothing:antialiased;
    }

    .wrap{max-width:960px; margin:0 auto; padding:16px clamp(14px,4vw,24px) 28px; display:flex; flex-direction:column; gap:12px}
    h1{margin:0; font-weight:800; letter-spacing:.2px; font-size:clamp(20px,6vw,32px)}

    button{
      appearance:none; border:1px solid var(--border);
      background: linear-gradient(180deg, color-mix(in oklab, var(--panel) 92%, var(--accent-2) 8%), var(--panel));
      color:var(--ink); border-radius:12px; padding:12px 14px; font-weight:700;
      font-size:14px; cursor:pointer; transition:transform .06s ease, box-shadow .2s ease, border-color .2s ease;
      min-height:44px;
    }
    button.primary{
      background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 85%, #fff 5%), color-mix(in oklab, var(--accent) 65%, #000 5%));
      color:#031019; border-color: color-mix(in oklab, var(--accent) 40%, var(--border)); text-shadow:0 1px 0 rgba(255,255,255,.25);
    }
    button:hover{box-shadow:0 6px 22px rgba(0,0,0,.22)}
    button:active{transform:translateY(1px)}
    button:focus-visible{outline:3px solid var(--focus); outline-offset:2px}

    .card{background: linear-gradient(180deg, color-mix(in oklab, var(--panel) 92%, #000 8%), var(--panel));
      border:1px solid var(--border); border-radius:16px; padding:14px; box-shadow:0 6px 24px rgba(0,0,0,.18)}
    .row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
    .grid{display:grid; grid-template-columns:1fr; gap:10px}
    @media(min-width:680px){ .grid{grid-template-columns:repeat(3, minmax(0,1fr))} }

    label{font-size:12px; color:var(--muted); display:block; margin:2px 0 6px}
    select, input[type="text"]{
      width:100%; padding:12px 14px; border-radius:12px;
      background: color-mix(in oklab, var(--panel) 65%, #000 25%);
      color:var(--ink); border:1px solid var(--border); font-size:15px;
      transition:border-color .2s, box-shadow .2s, background .2s; min-height:44px;
    }

    .stage{min-height:120px; padding:16px; border-radius:14px; background:var(--stage);
      border:1px dashed color-mix(in oklab, var(--border) 70%, #000 10%); display:flex; align-items:center; justify-content:center; text-align:center}
    .nickname{font-size:clamp(22px,6.2vw,36px); display:flex; flex-wrap:wrap; gap:8px; line-height:1.35; justify-content:center}
    .chip{display:inline-block; padding:8px 10px; border-radius:10px; background:#fff; color:#000;
      box-shadow:0 1px 0 rgba(255,255,255,.28) inset, 0 6px 18px rgba(0,0,0,.28); transition:transform .15s ease, box-shadow .2s ease}
    .chip:hover{transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.32)}
    .glue{opacity:.9; color:color-mix(in oklab, var(--accent-2) 65%, #fff 10%); font-weight:800}

    .status{font-size:12.5px; color:var(--muted)}
    .status.ok{color:var(--success); font-weight:700}
  </style>
</head>

        </div>
        <span id="status" class="status">Ready</span>

    </div>

    <div class="card">
      <div class="stage"><div id="nickname" class="nickname" aria-live="polite"></div></div>

    // DOM
    const elNick=document.getElementById('nickname');
    const elCategory=document.getElementById('category');
    const elStatus=document.getElementById('status');
    const elMust=document.getElementById('mustInclude');

    let currentWords=[];

    function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}
    function hashStr(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

    function render(words){
      elNick.innerHTML='';
      words.forEach((w,i)=>{
        const span=document.createElement('span'); span.className='chip'; span.textContent=w; elNick.appendChild(span);
        if(i<words.length-1){ const g=document.createElement('span'); g.className='glue'; g.textContent=' '; elNick.appendChild(g); }
      });
    }

    function pick(rng, list){ return list[Math.floor(rng()*list.length)]; }

    function maskBadWord(w){
      const s=String(w);
      if(s.length<=2) return '*'.repeat(s.length);
      return s[0] + '*'.repeat(Math.max(1, s.length-2)) + s[s.length-1];
    }

    function generate(){
      const count=parseInt(document.getElementById('count').value,10);
      const alliterate=document.getElementById('alliterate').value==='on';
      const profanityOn=document.getElementById('profanity').value==='on';
      const category=elCategory.value;

      const rng=mulberry32(hashStr((category||'')+':' + (elMust.value||'') + ':'+Date.now()+':'+Math.random()));
      let words=[];

      // Alliteration seed
      let letter=null;
      if(alliterate){
        const basePool = category && TOPIC[category]?.length ? TOPIC[category] : [...ANIMALS,...ROLES,...OBJECTS];
        const sample = pick(rng, basePool);
        letter = sample?.[0]?.toLowerCase() || null;
      }

      // adjectives
      const adjCount=(count===3)?2:1;
      for(let i=0;i<adjCount;i++){
        let pool=ADJ;
        if(letter){ const sub=ADJ.filter(w=>w[0]===letter); if(sub.length) pool=sub; }
        words.push(pick(rng,pool));
      }

      // noun: from category if chosen, else random
      let nounPool = category && TOPIC[category] ? TOPIC[category] : [...ANIMALS,...ROLES,...OBJECTS];
      if(letter){ const sub=nounPool.filter(w=>w[0]===letter); if(sub.length) nounPool=sub; }
      words.push(pick(rng,nounPool));

      // must include override (exact keep, even if profane)
      const must=(elMust.value||'').trim();
      if(must){
        const lowerSet=new Set(words.map(w=>String(w).toLowerCase()));
        if(!lowerSet.has(must.toLowerCase())) words[0]=must;
      }

      // ===== Profanity policy handling =====
      if(profanityOn){
        // mask profane words unless it's the explicit must-include
        const mustLower=must.toLowerCase();
        words=words.map(w=>{
          const wl=String(w).toLowerCase();
          if(isBad(wl) && wl!==mustLower){ return maskBadWord(w); }
          return w;
        });
      }else{
        // if none profane, inject one
        if(!words.some(w=>isBad(String(w).toLowerCase()))){
          const pos=Math.floor(rng()*words.length);
          words[pos]=pick(rng,BAD);
        }
      }

      currentWords=words;
      render(words);
      elStatus.textContent='Generated';
      elStatus.classList.add('ok');
      setTimeout(()=>{ elStatus.classList.remove('ok'); elStatus.textContent='Ready'; },900);
    }

    document.getElementById('genBtn').addEventListener('click',generate);
    document.getElementById('copyBtn').addEventListener('click',()=>{
      navigator.clipboard.writeText(currentWords.join(' '));
      elStatus.textContent='Copied';
      elStatus.classList.add('ok');
      setTimeout(()=>{ elStatus.textContent='Ready'; elStatus.classList.remove('ok'); },900);
    });
  </script>
